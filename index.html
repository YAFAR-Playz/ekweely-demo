<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/ekweely-demo/">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#F1F7F9">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Laundry and ironing, picked up and brought back to your door.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Ekweely">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Ekweely</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <style>
    html,body{margin:0;background:#FDFAF6}
    #nl-badge-frame{display:none!important}
    #ek-splash{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;background:#FDFAF6;z-index:9;transition:opacity .3s}
    #ek-splash b{font:700 34px/1 system-ui,-apple-system,sans-serif;color:#14305a;letter-spacing:-.5px}
    #ek-splash i{width:28px;height:28px;border-radius:50%;border:3px solid #d9e6ea;border-top-color:#1F6F8B;animation:ek 0.9s linear infinite}
    #ek-splash small{font:500 13px system-ui,sans-serif;color:#8a8478}
    @keyframes ek{to{transform:rotate(360deg)}}
  </style>
  <div id="ek-splash"><b>Ekweely</b><i></i><small>Loading the demo… / جاري التحميل</small></div>
  <script>
    window.addEventListener('flutter-first-frame',function(){var e=document.getElementById('ek-splash');if(e){e.style.opacity=0;setTimeout(function(){e.remove()},350);}});
  </script>

  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
